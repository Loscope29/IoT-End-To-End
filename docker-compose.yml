services:

  # ── Broker MQTT
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data/mosquitto:/mosquitto/data
    networks: [iot-net]

  # ── Zookeeper (requis par Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [iot-net]

  # ── Broker de streaming
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [iot-net]

  # ── Base time-series
  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: iot-org
      DOCKER_INFLUXDB_INIT_BUCKET: electricite
    volumes:
      - ./data/influx:/var/lib/influxdb2
    networks: [iot-net]

  # ── Base relationnelle
  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: iot_elec
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [iot-net]

  # ── Ton code Python
  worker:
    build: ./worker
    depends_on: [kafka, influxdb, postgres]
    env_file: .env
    restart: on-failure
    networks: [iot-net]

  # ── Pont MQTT → Kafka
  bridge:
    build: ./bridge
    depends_on: [mosquitto, kafka]
    env_file: .env
    restart: on-failure
    networks: [iot-net]

  # ── Simulateur capteurs
  simulator:
    build: ./simulator
    depends_on: [mosquitto]
    env_file: .env
    restart: on-failure
    networks: [iot-net]

  # ── Dashboard temps réel
  grafana:
    image: grafana/grafana:10.0.0
    ports: ["3000:3000"]
    depends_on: [influxdb]
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards
    networks: [iot-net]

  # ── Reporting BI
  metabase:
    image: metabase/metabase:latest
    ports: ["3001:3000"]
    depends_on: [postgres]
    networks: [iot-net]

networks:
  iot-net:
    driver: bridge